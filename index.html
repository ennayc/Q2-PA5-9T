<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Form</title>

    <!--CSS-->
    <link rel="stylesheet" href="style.css">
    

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</head>
<body>
    
    <div class="container bg-success text-warning rounded mt-5 p-5">
        <form action="" method="post">

            <h2>Custom Sneaker Order Form</h2>

            <div class="form-group">
                <label for="form-name">Name:</label>
                <input type="text" name="username" id="form-name" class="form-label textinput form-control">  
            </div>


            <!--.form-group*3-->
                <div class="form-group"></div>
                <div class="form-group"></div>
                <div class="form-group"></div>
    
        <!--EMAIL-->
        <label for="form-email">Email:</label> 
        <input type="email" name="emailaddress" id="form-email"class="form-label textinput form-control">

        <!--TELE-->
        <label for="form-tel">Telephone:</label> 
        <input type="tel" name="telephone" id="form-tel"class="form-label textinput form-control">

        <!--ABT URSELF-->
        <label for="form-story">Tell us about yourself:</label> 
        <textarea name="story" maxlength="600" id="form-story" placeholder="No more than 600 characters long" class="form-control"></textarea>
        
        <label for="sizes">Size:</label>
        <select name="size" id="sizes" class="form-label">
            <option>5</option>
            <option>6</option>
            <option>7</option>
            <option>8</option>
            <option>9</option>
            <option>10</option>
            <option>11</option>
            <option>12</option>
            <option>13</option>
        </select> 
        
        <em>Sizes reflect standard US men's sizes</em>
            
        <label for="colors">Sneaker Color:</label>
        <fieldset id="colors">

            
            <legend>Color</legend>

                <div class="form-check">
                    <label class="form-check-label"><input type="radio" name="color" value="red" class="form-check-input">Red</label>
                </div>

                 <div class="form-check">
                    <label class="form-check-label"><input type="radio" name="color" value="blue" class="form-check-input">Blue</label>
                </div>

                 <div class="form-check">
                    <label class="form-check-label"><input type="radio" name="color" value="green" class="form-check-input">Green</label>
                </div>

                 <div class="form-check">
                    <label class="form-check-label"><input type="radio" name="color" value="yellow" class="form-check-input">Yellow</label>
                </div>
           
        </fieldset>
            
        <label for="features">Add-on Features:</label>

            <div class="form-check"></div>

        <fieldset id="features">
            <legend>Feature</legend>
            <label><input type="checkbox" name="feature" value="laces"> Sparkley laces</label>
            <label><input type="checkbox" name="feature" value="logo" checked> Metallic logo</label>
            <label><input type="checkbox" name="feature" value="heels"> Light-up heels</label>
            <label><input type="checkbox" name="feature" value="mp3"> MP3-enabled</label>
        </fieldset>
            
        <button type="button" class="btn btn-warning mt-4">
            ENTER
        </button>

        </form>
    </div>

   

</body>
</html>
